name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 */3 * *" # every 3 days at 00:00 UTC
  workflow_dispatch: # lets you run it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi